<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvertPDF | Premium Document AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader { border-top-color: #764ba2; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-xl w-full p-10 rounded-3xl shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">ConvertPDF</h1>
            <p class="text-gray-500">Transform documents with 100% layout precision.</p>
        </div>

        <form id="uploadForm" action="/convert" method="POST" enctype="multipart/form-data">
            <div id="dropzone" class="relative border-2 border-dashed border-purple-300 rounded-2xl p-12 text-center hover:border-purple-500 transition-all cursor-pointer bg-purple-50">
                <input type="file" name="pdf_file" id="fileInput" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                <div id="fileInfo">
                    <div class="bg-purple-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="id="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <p class="text-lg font-medium text-gray-700">Click or drag PDF here</p>
                    <p class="text-sm text-gray-400">Maximum file size: 25MB</p>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-8 bg-purple-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-purple-700 hover:-translate-y-1 transition-all flex items-center justify-center">
                <span>Convert to Word</span>
            </button>
        </form>

        <div id="loadingState" class="hidden text-center mt-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
            <p class="text-purple-700 font-medium animate-pulse">Analyzing document structure...</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingState = document.getElementById('loadingState');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');

        fileInput.addEventListener('change', (e) => {
            if(fileInput.files.length > 0) {
                fileInfo.innerHTML = `<p class="text-purple-600 font-bold">${fileInput.files[0].name}</p>`;
            }
        });

        form.onsubmit = () => {
            submitBtn.classList.add('hidden');
            loadingState.classList.remove('hidden');
        };
    </script>
</body>
</html>
